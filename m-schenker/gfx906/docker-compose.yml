# Strata for AMD gfx906 (Instinct MI50 / MI60, Radeon VII) - one container, one model, both engines.
#
# The image is built from this repository (m-schenker/gfx906/Dockerfile) and carries Strata's two engines:
#
#   strata        the Qwen path        - a Qwen GGUF, packed by tools/iq_pack.py
#   strata-dsv41  the DeepSeek path    - a DeepSeek-V4.1 GGUF, packed by tools/dsv41/pack_gguf.py
#
# Which one runs is decided per model, not per container: generate-run-config.py reads the GGUF's `general.architecture` and writes
# the run config for the engine that model needs.  The settings below are shared; the ones that only one engine reads
# are marked (Qwen) or (DeepSeek).  Use one container per model, as this file arranges.
#
#   ~/.strata/data            (STRATA_DATA_DIR; the default the volumes below use)
#       config/strata.json        the run config for a Qwen model      (written on the first start)
#       config/strata-dsv41.json  the run config for a DeepSeek model  (written on the first start)
#       state/api-key             the API key, made once on the first start (or set STRATA_API_KEY)
#       logs/strata.log           the Qwen engine's log
#       logs/strata-dsv41.log     the DeepSeek engine's log
#       packs/default             the Qwen model pack      (docker compose run --rm strata pack)
#       packs/dsv41               the DeepSeek model pack  (docker compose run --rm strata pack)
#       mtp/rt                    the MTP draft layer (Qwen only, optional: docker compose run --rm strata mtp)
#       tmp                       the runtime's temp files
#
# The host folder in STRATA_MODEL_DIR is mounted read-only at /models (the default is ~/.strata/models; .env.example
# suggests /mnt/models, where many machines keep their GGUFs): the GGUF files are read, never changed.
#
#   docker compose -f m-schenker/gfx906/docker-compose.yml build
#   docker compose -f m-schenker/gfx906/docker-compose.yml run --rm strata pack
#   docker compose -f m-schenker/gfx906/docker-compose.yml up -d
#
# The host needs the amdgpu kernel driver (ROCm) and Docker with the device cgroup access below.
#
# Rootless Docker (`dockerd-rootless-setuptool.sh install`, no root at any point) works with this file, with one
# setting: a rootless daemon cannot raise the invoking user's hard rlimit, so the memlock ulimit below is the one key
# it refuses.  Pass the limit the user already has, in bytes (`ulimit -Hl` prints KiB, multiply by 1024):
#
#   MEMLOCK=8388608 docker compose -f m-schenker/gfx906/docker-compose.yml up -d
#
# The device nodes are handed to the container as ordinary bind mounts there, so the nodes' modes and ACLs on the host
# decide access for that user (usually crw-rw-rw- on /dev/kfd and /dev/dri/renderD*), not group_add: a numeric GID
# inside a rootless user namespace maps to a sub-GID, which is not the host's render/video group.  The entrypoint says
# so and opens the nodes to check them.  See "Rootless Docker" in REFERENCE.md.

name: strata-gfx906

services:
  strata:
    build:
      context: ../..
      dockerfile: m-schenker/gfx906/Dockerfile
      args:
        # A plain base: ROCm is fetched from AMD's TheRock nightlies (a gfx906 tarball), not from a vendor image.
        BASE_IMAGE: ${BASE_IMAGE:-ubuntu:24.04}
        # TheRock builds for gfx906 at https://nightly.repo.amd.com/rocm/core/tarball/ - the newest date first.
        # gfx906 is "Build Passing" there, not "Sanity Tested": AMD publishes the tarball but does not run it on an
        # MI50.  Pin another date, or the stable channel (https://stable.repo.amd.com/rocm/core/tarball), if one fails.
        ROCM_VERSION: ${ROCM_VERSION:-10.3.0a20261027}
        ROCM_BASE_URL: ${ROCM_BASE_URL:-https://nightly.repo.amd.com/rocm/core/tarball}
        ROCM_ROOT: ${ROCM_ROOT:-/opt/rocm}
        # whole-URL and checksum overrides: a mirror, a file the user already has, a pinned digest
        ROCM_TARBALL: ${ROCM_TARBALL:-}
        ROCM_TARBALL_URL: ${ROCM_TARBALL_URL:-}
        ROCM_TARBALL_SHA256: ${ROCM_TARBALL_SHA256:-}
        # the llama.cpp commit pinned in third_party/ggml/VERSION.txt (ggml for the CPU lane, gguf-py for the packers)
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-3cf03257f219afbe7334045ff7c6a06ac68c627d}
        LLAMA_CPP_REPO: ${LLAMA_CPP_REPO:-https://github.com/ggml-org/llama.cpp.git}
        # one binary for older CPUs (AVX2 floor), as the community MI50 build
        STRATA_PORTABLE: ${STRATA_PORTABLE:-ON}
        STRATA_BUILD_JOBS: ${STRATA_BUILD_JOBS:-}
        STRATA_CMAKE_ARGS: ${STRATA_CMAKE_ARGS:-}
    image: ${STRATA_IMAGE:-strata-gfx906:0.2.15}
    container_name: ${STRATA_CONTAINER_NAME:-strata-gfx906}
    # on-failure:3, not unless-stopped: a crash (the engine killed by the OOM killer, say) gets three restarts, and a
    # CONFIGURATION error (no model, several models, a model the pack does not match) stops after three instead of
    # looping forever and filling the log.  `docker compose logs` then shows the message once per attempt.
    restart: on-failure:3

    # The two device nodes every ROCm container needs.  Without /dev/kfd the entrypoint stops with that sentence.
    # Rootless Docker accepts these too, but it passes the nodes through as bind mounts: the container process runs as
    # the invoking host user, so their modes and ACLs on the host decide access (a rootless daemon cannot mknod, and the
    # device cgroup is not enforced).  Ownership inside the container reads root:root there, which is not a fault.
    devices:
      - /dev/kfd
      - /dev/dri
    # /dev/kfd and /dev/dri belong to group video, the render nodes (/dev/dri/renderD128) to group render.  Docker
    # resolves these NAMES against the image's /etc/group before the container starts, so the image creates both
    # (video 44, render 109 - the Debian/Ubuntu GIDs); a name it cannot find stops the start with
    # "unable to find group render: no matching entries in group file".
    # If your host's render GID is not 109, the container starts but cannot open the render node. Use the host's
    # NUMBER instead - a number is taken as is, with no lookup:
    #   RENDER_GROUP=$(getent group render | cut -d: -f3) docker compose ... up -d
    # The same applies to video: RENDER_GROUP=video if your host keeps the render nodes in video (some boards do).
    group_add:
      - video
      - ${RENDER_GROUP:-render}
    # large pinned host allocations through /dev/shm; the ROCm documentation asks for both.  `ipc: host` is accepted by
    # a rootless daemon as well (measured: Docker 29.9 rootless, /dev/shm of the container is the host's).
    ipc: host
    ulimits:
      # -1 is the ROCm recommendation and what a rootful daemon gives.  A rootless daemon cannot raise the invoking
      # user's hard limit, and the container then never starts:
      #   error setting rlimits for ready process: error setting rlimit type 8: operation not permitted
      # So MEMLOCK passes a value the user already has, in bytes.  MEMLOCK=8388608 with this file's default of -1 for
      # everything else keeps the rootful path unchanged.
      memlock:
        soft: ${MEMLOCK:--1}
        hard: ${MEMLOCK:--1}

    # ---- the host CPUs this container may run on -------------------------------------------------------------
    # A hard pin (--cpuset-cpus), not a share: the threads outside it are never handed to the container, so the
    # engine cannot spill onto the other half of the host and an interactive session keeps its share.  It also
    # sizes the engines' host thread pools, because std::thread::hardware_concurrency() on Linux counts the
    # affinity mask.  On the DeepSeek path the CPU lane is part of the engine (the experts that fit neither VRAM nor
    # the RAM store), so this is the pool its workers are sized from too.
    #
    # 0-15 is the first 8 physical cores - 16 threads - on a 16-core/32-thread host whose sibling pairs are
    # numbered consecutively (AMD Zen: 0/1, 2/3, ... so 0-15 = cores 0-7, both threads each).  On an Intel-style
    # layout 0-15 is the FIRST thread of all 16 cores instead, and the first 8 cores are 0-7 plus 16-23.  Check
    # before relying on it; the CORE column is the physical core:
    #   lscpu -e=CPU,CORE,SOCKET
    # Then pass the range, e.g. CPUSET=0-7,16-23 docker compose ... up -d.  CPUSET=0-31 removes the pin.
    #
    # "Your kernel does not support cpuset or the cgroup is not mounted. Cpuset discarded." is about the host, not
    # this file: the daemon could not find the cpuset controller, so it dropped the pin and the container runs on
    # every thread of the machine.  A rootless daemon on cgroup v1 cannot set a cpuset at all, and on cgroup v2 the
    # controller has to be delegated to the user manager.  "Host CPUs" in REFERENCE.md has the one-line check and the
    # fix; until then `docker update --cpus 16 <container>` is a time share (not a pin) that works everywhere.
    cpuset: ${CPUSET:-0-15}

    ports:
      # 127.0.0.1 by default: only this computer.  STRATA_BIND=0.0.0.0 exposes it on the network - an API key is
      # made on the first start either way (docker compose exec strata cat /data/state/api-key).
      - "${STRATA_BIND:-127.0.0.1}:${STRATA_PORT:-8080}:8080"

    volumes:
      # everything that survives a restart: run configs, API key, logs, the model packs, the MTP runtime
      - ${STRATA_DATA_DIR:-${HOME}/.strata/data}:/data
      # the model files, read-only
      - ${STRATA_MODEL_DIR:-${HOME}/.strata/models}:/models:ro

    environment:
      # ---- the model -----------------------------------------------------------------------------------------
      # Empty: the model under /models is used when there is exactly ONE (*-00001-of-*.gguf).  Several models (a Qwen
      # build and a DeepSeek set, say) are not guessed: the start stops with a message that lists them, and MODEL_GGUF
      # or MODEL_DIR picks one.  The same shard file name in two folders counts as one model.
      MODEL_GGUF: ${MODEL_GGUF:-}
      MODEL_DIR: ${MODEL_DIR:-/models}
      # the model name clients see; empty: taken from the shard's file name
      MODEL_NAME: ${MODEL_NAME:-}
      # which engine the model needs: auto reads the GGUF's architecture; qwen / ds41 force one
      FAMILY: ${FAMILY:-auto}
      # where the packs, the MTP runtime and the logs live inside the container (all under /data).  Empty: the pack
      # folder the model's engine uses (default: /data/packs/default, ds41: /data/packs/dsv41).
      PACK_DIR: ${PACK_DIR:-}
      MTP_DIR: ${MTP_DIR:-/data/mtp/rt}
      # empty: the profile the repository ships (data/expert-profile.bin, or -coder.bin for a Coder model)   (Qwen)
      EXPERT_PROFILE: ${EXPERT_PROFILE:-}
      # extra arguments for the packer: PACK_ARGS (DeepSeek, e.g. "--engram /models/Engram"), and the drafter and the
      # vision tower when they are not beside the model folder
      PACK_ARGS: ${PACK_ARGS:-}
      DSPARK_GGUF: ${DSPARK_GGUF:-}
      MMPROJ: ${MMPROJ:-}

      # ---- the engines (docs/AMD_HIP.md, gfx906) -------------------------------------------------------------
      # context: 32768 for a Qwen model, 8192 for DeepSeek (which is what its engine was checked at)
      CONTEXT: ${CONTEXT:-}
      KV: ${KV:-int8}                          # (Qwen)
      KV_RESIDENT: ${KV_RESIDENT:-}            # (Qwen)
      PREFILL: ${PREFILL:-512}                 # (Qwen)  the DeepSeek engine takes PREFILL_CHUNK instead
      SPEC: ${SPEC:-3}                         # (Qwen, needs MTP_DIR)
      SPEC_MIN_P: ${SPEC_MIN_P:-0.5}           # (Qwen)
      EXPERT_CACHE: ${EXPERT_CACHE:-auto}      # (Qwen)
      VISION: ${VISION:-off}                   # (DeepSeek) off: the tower has not been run on an MI50
      DSPARK: ${DSPARK:-auto}                  # (DeepSeek) drafting, when the pack carries the drafter
      DSPARK_CONF: ${DSPARK_CONF:-}            # (DeepSeek)
      PREFILL_CHUNK: ${PREFILL_CHUNK:-}        # (DeepSeek)
      TP: ${TP:-}                              # (DeepSeek)
      VRAM_EXPERTS: ${VRAM_EXPERTS:-}          # (DeepSeek)
      SSD_CACHE: ${SSD_CACHE:-}                # (DeepSeek) the RAM store, in GB
      SSD_POLICY: ${SSD_POLICY:-}              # (DeepSeek)
      CPU_THREADS: ${CPU_THREADS:-}            # (DeepSeek)
      MMAP_EXPERTS: ${MMAP_EXPERTS:-}          # (DeepSeek on/off/auto; a flag on the Qwen engine)
      VRAM_RESERVE_MIB: ${VRAM_RESERVE_MIB:-1024}   # (Qwen --vram-reserve-mib, DeepSeek --reserve-mib)
      # Empty: every visible card (the server skips an integrated Radeon while a card of its own can run).
      # "0" pins one card; "0,1" uses two (the Qwen engine splits the layers, the DeepSeek engine balances itself).
      # Cards on links of different widths are worth choosing deliberately: the narrowest link caps the whole set, and
      # adding cards then stops scaling.  On bare metal /sys/class/drm/card*/device/current_link_width says which are
      # wide; inside a VM every emulated port reports the widest, so compare the groups by measuring prefill.
      # gfx906-performance-notes.md has the background.
      GPUS: ${GPUS:-}
      # only with two or more cards: the first layer of each later card, e.g. "27" for layers 0-26 / 27-47   (Qwen)
      LAYER_SPLIT: ${LAYER_SPLIT:-}
      # anything else for either engine, as one string: "--pipeline-windows 2 --trim-stage-weights"
      EXTRA_ARGS: ${EXTRA_ARGS:-}
      # the server's simultaneous slots (unset: the engine's own)
      PARALLEL: ${PARALLEL:-}
      # minutes, not seconds: the expert cache fills from the profile on a first start (Qwen, 1800), and a DeepSeek
      # set of 250-500 GB is read from disk (3600).  Empty: the engine's own default.
      ENGINE_READY_S: ${ENGINE_READY_S:-}
      STRATA_CONFIG_RESET: ${STRATA_CONFIG_RESET:-0}

      # ---- gfx906 switches, off by default in the engines -----------------------------------------------------
      # The two gfx906 attention switches: this container turns both on.  They move the QSA attention reduction off the
      # shared-memory bounce and onto the card's swizzle operations; upstream's own bench reports a gain there with
      # unchanged token ids.  Set either to 0 to compare on your own cards (gfx906-performance-notes.md).
      STRATA_GFX906_ATTN_QUERY_SWIZZLE: ${STRATA_GFX906_ATTN_QUERY_SWIZZLE:-1}
      STRATA_GFX906_ATTN_REDUCE12: ${STRATA_GFX906_ATTN_REDUCE12:-1}
      # (Qwen) an all-experts-in-VRAM setup can use this, with --pcie-frac 0 in EXTRA_ARGS
      STRATA_ARENA_MMAP: ${STRATA_ARENA_MMAP:-0}
      # A/B switches back to the CUDA layout, for a comparison: see docs/AMD_HIP.md's gfx906 table
      STRATA_EXP_MODE: ${STRATA_EXP_MODE:-}
      STRATA_MMVQ_WAVE: ${STRATA_MMVQ_WAVE:-}
      STRATA_ROUTE_PER_TOKEN: ${STRATA_ROUTE_PER_TOKEN:-}
      STRATA_GR_FAST: ${STRATA_GR_FAST:-}
      # (Qwen) the hyper-connection down projection split along K: about 3% a window on gfx906, sums in another order
      STRATA_GR_SPLIT: ${STRATA_GR_SPLIT:-0}
      # (DeepSeek) the windowed decode's mailbox path for windows up to this size; upstream measured 4 faster on an APU
      DS4_ASYNC_T: ${DS4_ASYNC_T:-}

      # ---- the server ---------------------------------------------------------------------------------------
      PORT: "8080"
      BIND_HOST: 0.0.0.0
      # Empty: an API key is made on the first start and kept in /data/state/api-key.  NO_API_KEY=1 serves without one
      # (a warning, never a refusal).
      API_KEY: ${STRATA_API_KEY:-}
      NO_API_KEY: ${NO_API_KEY:-0}

      # ---- the runtime ---------------------------------------------------------------------------------------
      # On some boards the runtime refuses gfx906 until this names the card.  It names gfx906 itself, so it changes
      # nothing on a board that does not need it; set it empty to drop it.
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-9.0.6}
      # pin the cards the runtime may open (both left empty: every card in the container)
      HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-}
      ROCR_VISIBLE_DEVICES: ${ROCR_VISIBLE_DEVICES:-}

    # The image's own health check (GET /v1/models with the key).  The start period covers the first model load and the
    # expert-cache fill, which take minutes - and, for a DeepSeek set, tens of minutes.
    healthcheck:
      test: ["CMD", "/opt/strata/container-healthcheck.sh"]
      interval: 30s
      timeout: 15s
      start_period: 60m
      retries: 5

    # A request in flight gets its time to finish before the engine is stopped.
    stop_grace_period: 2m

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    # Some Docker/seccomp versions block the ioctls the ROCm runtime needs; the ROCm documentation asks for this.  A
    # rootless daemon applies the same built-in profile, and accepts this option too (measured: Docker 29.9 rootless).
    security_opt:
      - seccomp:unconfined
